      <style>#loader{z-index:50;color:#f4f6ff;background:radial-gradient(at 50% 120%,#2a1d5e,#070920 60%);place-items:center;font-family:Fredoka,Nunito,system-ui,sans-serif;transition:opacity .7s;display:grid;position:fixed;inset:0}#loader.out{opacity:0;pointer-events:none}#loader .box{text-align:center;width:min(420px,82vw)}#loader .star{width:64px;height:64px;margin:0 auto 18px;animation:2.4s linear infinite spin}#loader h1{margin:0 0 6px;font-size:clamp(26px,5vw,40px)}#loader p{color:#aab3e6;min-height:20px;margin:0 0 18px;font-size:15px}#loader .bar{background:#ffffff1f;border-radius:99px;height:10px;overflow:hidden}#loader .fill{background:linear-gradient(90deg,#ffcf3f,#ff8f5c);border-radius:99px;width:8%;height:100%;transition:width .4s}#loader .dots{justify-content:center;gap:6px;margin-top:18px;display:flex}#loader .dots i{opacity:.2;background:#fff;border-radius:50%;width:4px;height:4px;animation:1.6s ease-in-out infinite tw}@keyframes spin{to{transform:rotate(360deg)}}@keyframes tw{50%{opacity:1}}</style>

        <div class="dots"><i></i><i style="animation-delay:.2s"></i><i style="animation-delay:.4s"></i><i style="animation-delay:.6s"></i><i style="animation-delay:.8s"></i></div>
      </div>
      <script>
        (function () {
          var f = document.getElementById('loadfill'), p = 8;
          window.__loadTimer = setInterval(function () { if (p < 38) { p += 1.5; f.style.width = p + '%'; } }, 120);
        })();
      </script>
    </div>
